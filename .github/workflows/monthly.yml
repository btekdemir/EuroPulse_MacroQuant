# Runs the pipeline around Eurostat's HICP release days and commits the ledger and outputs.
# UNTESTED until the repository is on GitHub (written 20 Oct 2026; there is no remote yet).
# No secrets needed: the pipeline uses public data only; the LLM features are not run here.
name: monthly-update
on:
  schedule:
    - cron: "0 11 1-3 * *"     # flash estimate: last working day of the month or the first days after
    - cron: "0 11 16-19 * *"   # full release: around mid-month
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "hicp-bot"
          git config user.email "hicp-bot@users.noreply.github.com"
      - name: Run pipeline, record and score the forecast, commit
        run: PY=python PUSH=1 bash scripts/monthly_update.sh
